[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "KEGGDB"
version = "0.1.0"
description = "Tools for accessing and reconstructing metabolic networks from KEGG data."
readme = 'README.md'
requires-python = ">=3.10"
authors = [
    {name = "Daniel Gamermann"}
]
dependencies = [
    "platformdirs>=4.0"
]

license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
KEGGDB = ["data/*"]
